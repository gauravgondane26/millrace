[package]
name = "jq-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
# The library behind the jaq CLI: input/inputs, error reports, std functions.
jaq-all = { version = "0.4", default-features = false, features = ["std-all"] }
# Only the CSV/TSV writer, for @csv and @tsv; not the YAML/TOML/XML/CBOR formats.
jaq-fmts = { version = "0.1", default-features = false, features = ["tabular"] }

# Smaller wasm; previews care about size over raw throughput.
[profile.release]
opt-level = "s"
lto = true

[package]
name = "jq-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"

# Smaller wasm; previews care about size over raw throughput.
[profile.release]
opt-level = "s"
lto = true
